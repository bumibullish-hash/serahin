<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Riwayat transaksi - Serahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="riwayat">
<header id="siteHeader"></header>
<main class="main">
<div class="container-narrow">
<div class="page-head"><h1>Riwayat transaksi</h1><p>Semua pesanan yang pernah Anda buat.</p></div>
<div class="chips" id="filterStatus">
<button type="button" class="chip active" data-status="">Semua</button>
<button type="button" class="chip" data-status="pending">Pending</button>
<button type="button" class="chip" data-status="paid">Paid</button>
<button type="button" class="chip" data-status="rejected">Rejected</button>
<button type="button" class="chip" data-status="expired">Expired</button>
</div>
<div id="daftarRiwayat"></div>
</div>
</main>
<footer id="siteFooter"></footer>
<script src="/js/common.js"></script>
<script src="/js/riwayat.js"></script>
</body>
</html>
