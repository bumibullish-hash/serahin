<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Akun saya - Serahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="akun">
<header id="siteHeader"></header>
<main class="main">
<div class="container">
<div class="page-head"><h1>Akun saya</h1><p id="emailAkun"></p></div>
<div class="stats stats-4">
<div class="stat"><span>Total pesanan</span><strong id="statTotal">0</strong></div>
<div class="stat"><span>Menunggu pembayaran</span><strong id="statMenunggu">0</strong></div>
<div class="stat good"><span>Pesanan berhasil</span><strong id="statBerhasil">0</strong></div>
<div class="stat accent"><span>Total pembayaran</span><strong id="statBelanja">Rp 0</strong></div>
</div>
<div class="grid-2">
<div class="panel"><div class="panel-head"><h2>Transaksi terbaru</h2><a href="/riwayat">Lihat semua</a></div><div class="panel-body" id="pesananTerbaru"></div></div>
<div>
<div class="panel"><div class="panel-head"><h2>Profil</h2></div><div class="panel-body">
<form id="formProfil" novalidate>
<div class="alert alert-error form-alert hidden" role="alert"></div>
<div class="field"><label for="nama">Nama lengkap</label><input class="input" id="nama" name="name" required></div>
<div class="field"><label for="hp">Nomor HP</label><input class="input" id="hp" name="phone" type="tel"></div>
<button type="submit" class="btn btn-primary">Simpan profil</button>
</form></div></div>
<div class="panel"><div class="panel-head"><h2>Ubah password</h2></div><div class="panel-body">
<form id="formPassword" novalidate>
<div class="alert alert-error form-alert hidden" role="alert"></div>
<div class="field"><label for="lama">Password lama</label><input class="input" id="lama" name="oldPassword" type="password" autocomplete="current-password"></div>
<div class="field"><label for="baru">Password baru</label><input class="input" id="baru" name="newPassword" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div>
<div class="field"><label for="ulang">Ulangi password baru</label><input class="input" id="ulang" name="konfirmasi" type="password" autocomplete="new-password"></div>
<button type="submit" class="btn btn-primary">Ubah password</button>
</form></div></div>
</div>
</div>
</div>
</main>
<footer id="siteFooter"></footer>
<script src="/js/common.js"></script>
<script src="/js/akun.js"></script>
</body>
</html>
