<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Transaksi - Serahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-admin="transaksi">
<div class="admin-shell">
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-main">
<header class="topbar">
<button type="button" class="btn btn-ghost btn-sm menu-btn" id="menuBtn" aria-label="Buka menu"></button>
<h1>Transaksi</h1>

</header>
<main class="admin-content">
<div class="panel">
<form id="formFilter" class="filter-bar">
<div class="field"><label for="fCari">Cari</label><input class="input" id="fCari" name="search" placeholder="No. transaksi atau nama"></div>
<div class="field"><label for="fStatus">Pembayaran</label><select class="select" id="fStatus" name="status"><option value="">Semua</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="rejected">Rejected</option><option value="expired">Expired</option></select></div>
<div class="field"><label for="fPesanan">Pesanan</label><select class="select" id="fPesanan" name="orderStatus"><option value="">Semua</option><option value="menunggu_pembayaran">Menunggu pembayaran</option><option value="diproses">Dikerjakan</option><option value="siap_diambil">Hasil terkirim</option><option value="selesai">Selesai</option><option value="dibatalkan">Dibatalkan</option></select></div>
<div class="field"><label for="fDari">Dari tanggal</label><input class="input" type="date" id="fDari" name="from"></div>
<div class="field"><label for="fSampai">Sampai tanggal</label><input class="input" type="date" id="fSampai" name="to"></div>
<button type="submit" class="btn btn-primary">Terapkan</button>
<button type="button" class="btn btn-outline" id="resetFilter">Reset</button>
</form>
<div class="table-wrap"><table class="table responsive"><thead><tr><th>No. transaksi</th><th>Tanggal</th><th>Pelanggan</th><th class="text-right">Total</th><th>Pembayaran</th><th>Pesanan</th><th></th></tr></thead>
<tbody id="tabelTransaksi"></tbody></table></div>
<div class="pagination"><button type="button" class="btn btn-outline btn-sm" id="sebelumnya">Sebelumnya</button><span id="infoHalaman"></span><button type="button" class="btn btn-outline btn-sm" id="berikutnya">Berikutnya</button></div>
<div style="height:1rem"></div>
</div>
<div class="panel">
<div class="panel-head"><h2>Transaksi di Bayaraja</h2>
<div class="flex gap wrap center-y"><select class="select" id="statusBayaraja" aria-label="Filter status Bayaraja"><option value="">Semua status</option><option value="confirmed">confirmed</option><option value="pending">pending</option><option value="rejected">rejected</option></select>
<button type="button" class="btn btn-primary btn-sm" id="tombolSinkron">Sinkronkan dengan Bayaraja</button></div></div>
<div class="panel-body"><div id="hasilSinkron" class="hidden" role="status"></div>
<p class="muted">Sinkronisasi memeriksa pesanan yang belum Paid, lalu mengambil daftar transaksi dari Bayaraja sesuai filter tanggal di atas.</p></div>
<div class="table-wrap"><table class="table responsive"><thead><tr><th>ID Bayaraja</th><th>Waktu</th><th>Pembayar</th><th class="text-right">Nominal</th><th>Status</th></tr></thead>
<tbody id="tabelBayaraja"></tbody></table></div>
</div>
</main>
</div>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin-transaksi.js"></script>
</body>
</html>
