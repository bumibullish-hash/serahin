<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Daftar - Serahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="auth-wrap">
<div class="auth-card">
<a class="logo" href="/">Serah<span>in</span></a>
<h1>Buat akun baru</h1>
<p class="muted">Daftar untuk mulai memesan layanan.</p>
<form id="formRegister" novalidate>
<div class="alert alert-error form-alert hidden" role="alert"></div>
<div class="field"><label for="name">Nama lengkap</label><input class="input" type="text" id="name" name="name" autocomplete="name" required></div>
<div class="field"><label for="email">Email</label><input class="input" type="email" id="email" name="email" autocomplete="email" required></div>
<div class="field"><label for="phone">Nomor HP (opsional)</label><input class="input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="08xxxxxxxxxx"></div>
<div class="field"><label for="password">Password</label><input class="input" type="password" id="password" name="password" autocomplete="new-password" placeholder="Minimal 6 karakter" required></div>
<div class="field"><label for="konfirmasi">Ulangi password</label><input class="input" type="password" id="konfirmasi" name="konfirmasi" autocomplete="new-password" required></div>
<button type="submit" class="btn btn-primary btn-block">Daftar</button>
</form>
<p class="auth-foot">Sudah punya akun? <a href="/login">Masuk</a></p>
</div>
</main>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
